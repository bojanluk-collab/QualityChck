<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CargoCheck — Customs Document Verification</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg: #141b24;
    --surface: #1c2530;
    --surface-2: #232e3b;
    --surface-3: #2a3644;
    --border: #33414f;
    --border-soft: #2a3542;
    --text: #e8ecf0;
    --text-dim: #93a3b1;
    --text-faint: #5f6f7e;
    --pass: #4fa88c;
    --pass-dim: #2d4640;
    --fail: #d9685f;
    --fail-dim: #4a2f2d;
    --warn: #e2a33d;
    --warn-dim: #4a3c22;
    --primary: #6f9bd1;
    --primary-dim: #24374d;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body{
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(111,155,209,0.08), transparent),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(79,168,140,0.05), transparent);
    color: var(--text);
    font-family: var(--font-body);
    line-height: 1.5;
    min-height: 100vh;
    padding-bottom: 110px;
  }
  ::selection{ background: var(--primary-dim); }
  a { color: var(--primary); }

  /* Header */
  header.topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 22px 32px;
    border-bottom: 1px solid var(--border-soft);
    background: rgba(20,27,36,0.85);
    backdrop-filter: blur(8px);
    position: sticky; top:0; z-index: 40;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{
    height:36px; width:auto; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .brand-mark img{ height:36px; width:auto; display:block; }
  .brand-text h1{
    font-family: var(--font-display); font-size:17px; font-weight:600; margin:0; letter-spacing:0.2px;
  }
  .brand-text p{ margin:0; font-size:12px; color: var(--text-dim); }
  .lang-select{
    display:flex; align-items:center; gap:8px;
    font-size:12.5px; color: var(--text-dim);
  }
  .lang-select select{
    background: var(--surface-2); color: var(--text); border:1px solid var(--border);
    border-radius:7px; padding:6px 10px; font-family: var(--font-body); font-size:12.5px;
  }

  main{ max-width: 980px; margin: 0 auto; padding: 28px 24px 40px; }

  /* Rules panel */
  .rules-panel{
    background: var(--surface);
    border:1px solid var(--border-soft);
    border-radius: var(--radius);
    margin-bottom: 22px;
    overflow:hidden;
  }
  .rules-header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 18px; cursor:pointer; user-select:none;
  }
  .rules-header-left{ display:flex; align-items:center; gap:10px; }
  .rules-header h2{ font-family: var(--font-display); font-size:14.5px; font-weight:600; margin:0; }
  .rules-count{
    font-size:11px; color: var(--text-dim); background: var(--surface-3);
    padding: 2px 8px; border-radius: 20px;
  }
  .chevron{ transition: transform 0.2s ease; color: var(--text-dim); }
  .chevron.open{ transform: rotate(180deg); }
  .rules-body{ display:none; padding: 4px 18px 18px; border-top: 1px solid var(--border-soft); }
  .rules-body.open{ display:block; }
  .rule-row{
    display:flex; align-items:center; gap:12px;
    padding: 10px 0; border-bottom: 1px dashed var(--border-soft);
    font-size: 13px;
  }
  .rule-row:last-of-type{ border-bottom:none; }
  .toggle{
    width:34px; height:19px; border-radius:20px; background: var(--surface-3);
    border:1px solid var(--border); position:relative; cursor:pointer; flex-shrink:0;
    transition: background 0.15s ease;
  }
  .toggle.on{ background: var(--pass-dim); border-color: var(--pass); }
  .toggle-dot{
    width:13px; height:13px; border-radius:50%; background: var(--text-faint);
    position:absolute; top:2px; left:2px; transition: all 0.15s ease;
  }
  .toggle.on .toggle-dot{ background: var(--pass); left:17px; }
  .rule-label{ flex:1; min-width:0; }
  .rule-label .name{ font-weight:500; }
  .rule-label .meta{ color: var(--text-faint); font-size:11.5px; font-family: var(--font-mono); }
  .rule-tag{
    font-size: 10.5px; font-family: var(--font-mono); color: var(--text-dim);
    background: var(--surface-3); padding: 2px 7px; border-radius: 5px; white-space:nowrap;
  }
  .rule-remove{
    background:none; border:none; color: var(--text-faint); cursor:pointer; font-size:16px;
    padding: 2px 6px; border-radius:5px;
  }
  .rule-remove:hover{ color: var(--fail); background: var(--fail-dim); }
  .add-rule-btn{
    margin-top: 12px; background: var(--surface-2); border:1px dashed var(--border);
    color: var(--text-dim); font-size:12.5px; padding: 8px 14px; border-radius:7px;
    cursor:pointer; font-family: var(--font-body); width:100%; text-align:left;
  }
  .add-rule-btn:hover{ color: var(--text); border-color: var(--primary); }
  .add-rule-form{
    margin-top:10px; background: var(--surface-2); border:1px solid var(--border);
    border-radius:8px; padding:14px; display:flex; flex-direction:column; gap:10px;
  }
  .add-rule-form .row{ display:flex; gap:10px; }
  .add-rule-form input, .add-rule-form select{
    background: var(--surface-3); border:1px solid var(--border); color: var(--text);
    border-radius:6px; padding:8px 10px; font-family: var(--font-body); font-size:12.5px; flex:1;
    min-width:0;
  }
  .form-actions{ display:flex; gap:8px; justify-content:flex-end; }
  .btn-small{
    font-size:12px; padding:7px 13px; border-radius:6px; border:1px solid var(--border);
    background: var(--surface-3); color: var(--text-dim); cursor:pointer; font-family: var(--font-body);
  }
  .btn-small.primary{ background: var(--primary-dim); border-color: var(--primary); color: #cfe0f5; }
  .btn-small:hover{ filter: brightness(1.15); }

  /* Document sets */
  .set-card{
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    margin-bottom: 18px;
    overflow: hidden;
  }
  .set-head{
    display:flex; align-items:center; justify-content:space-between;
    padding: 16px 18px; border-bottom: 1px solid var(--border-soft);
  }
  .set-title-wrap{ display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
  .set-index{
    font-family: var(--font-mono); font-size:11px; color: var(--text-faint);
    background: var(--surface-3); width:24px; height:24px; border-radius:6px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .set-title{
    font-family: var(--font-display); font-size:15px; font-weight:600;
    background:none; border:none; color: var(--text); padding:2px 4px; border-radius:5px;
    max-width: 100%;
  }
  .set-title:focus{ outline: 1px solid var(--primary); background: var(--surface-2); }
  .set-remove{
    background:none; border:none; color: var(--text-faint); cursor:pointer; font-size:13px;
    padding:6px 10px; border-radius:6px; flex-shrink:0;
  }
  .set-remove:hover{ color: var(--fail); background: var(--fail-dim); }

  .set-body{ padding: 18px; }
  .upload-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
  @media (max-width: 680px){ .upload-grid{ grid-template-columns: 1fr; } }

  .upload-zone{
    border: 1.5px dashed var(--border);
    border-radius: 9px;
    padding: 16px;
    background: var(--surface-2);
    transition: border-color 0.15s ease, background 0.15s ease;
    min-height: 130px;
  }
  .upload-zone.drag{ border-color: var(--primary); background: var(--primary-dim); }
  .upload-zone-label{ font-size:12px; font-weight:600; color: var(--text-dim); margin-bottom:2px; letter-spacing:0.2px; text-transform:uppercase; }
  .upload-zone-hint{ font-size:11.5px; color: var(--text-faint); margin-bottom:10px; }
  .drop-inner{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px; padding: 14px 6px; cursor:pointer; border-radius:7px; text-align:center;
  }
  .drop-inner:hover{ background: var(--surface-3); }
  .drop-icon{ font-size:20px; color: var(--text-faint); }
  .drop-text{ font-size:12px; color: var(--text-dim); }
  .drop-text b{ color: var(--primary); font-weight:600; }
  .file-chip-list{ display:flex; flex-direction:column; gap:6px; margin-top:8px; }
  .file-chip{
    display:flex; align-items:center; gap:8px; background: var(--surface-3);
    border:1px solid var(--border-soft); border-radius:7px; padding:7px 9px; font-size:12px;
  }
  .file-chip-icon{ color: var(--text-faint); flex-shrink:0; }
  .file-chip-name{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .file-chip-remove{ background:none; border:none; color: var(--text-faint); cursor:pointer; font-size:14px; flex-shrink:0; padding:0 3px; }
  .file-chip-remove:hover{ color: var(--fail); }

  .set-error{
    margin-top:12px; background: var(--fail-dim); border:1px solid var(--fail);
    color:#f3c9c6; font-size:12.5px; padding:9px 12px; border-radius:7px;
  }

  /* Extracted data preview */
  .extract-section{ margin-top:18px; border-top:1px solid var(--border-soft); padding-top:16px; }
  .extract-title{ font-family: var(--font-display); font-size:12.5px; font-weight:600; color: var(--text-dim); text-transform:uppercase; letter-spacing:0.4px; margin-bottom:10px; }
  .manifest-table{ width:100%; border-collapse: collapse; font-family: var(--font-mono); font-size:12.5px; }
  .manifest-table th{
    text-align:left; font-family: var(--font-body); font-weight:600; font-size:11px;
    color: var(--text-faint); text-transform:uppercase; letter-spacing:0.3px;
    padding: 6px 10px; border-bottom: 1px solid var(--border-soft);
  }
  .manifest-table td{ padding: 9px 10px; border-bottom: 1px solid var(--border-soft); vertical-align:top; }
  .manifest-table tr:last-child td{ border-bottom:none; }
  .field-name{ font-family: var(--font-body); color: var(--text-dim); font-size:12.5px; white-space:nowrap; }
  .status-icon{ display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:50%; font-size:11px; font-weight:700; }
  .status-icon.ok{ background: var(--pass-dim); color: var(--pass); }
  .status-icon.bad{ background: var(--fail-dim); color: var(--fail); }
  .status-icon.warn{ background: var(--warn-dim); color: var(--warn); }
  .status-icon.na{ background: var(--surface-3); color: var(--text-faint); }
  .val-source{ color: var(--text); }
  .val-review{ color: var(--text); }
  .val-missing{ color: var(--text-faint); font-style:italic; }

  /* Stamp / verdict */
  .verdict{
    margin-top:18px; display:flex; align-items:center; gap:14px;
    padding: 14px 16px; border-radius: 9px; border:1px solid var(--border-soft);
  }
  .verdict.pass{ background: var(--pass-dim); border-color: rgba(79,168,140,0.5); }
  .verdict.fail{ background: var(--fail-dim); border-color: rgba(217,104,95,0.5); }
  .verdict.warn{ background: var(--warn-dim); border-color: rgba(226,163,61,0.5); }
  .stamp{
    width:48px; height:48px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:22px; font-weight:700; font-family: var(--font-display);
    border: 2.5px solid currentColor; transform: rotate(-8deg);
    animation: stamp-in 0.35s cubic-bezier(.2,1.6,.4,1);
  }
  .verdict.pass .stamp{ color: var(--pass); }
  .verdict.fail .stamp{ color: var(--fail); }
  .verdict.warn .stamp{ color: var(--warn); }
  @keyframes stamp-in{ from{ transform: scale(1.6) rotate(-8deg); opacity:0; } to{ transform: scale(1) rotate(-8deg); opacity:1; } }
  .verdict-text b{ font-family: var(--font-display); font-size:14.5px; display:block; margin-bottom:2px; }
  .verdict.pass .verdict-text b{ color: var(--pass); }
  .verdict.fail .verdict-text b{ color: var(--fail); }
  .verdict.warn .verdict-text b{ color: var(--warn); }
  .verdict-text span{ font-size:12px; color: var(--text-dim); }

  .confirm-btn{
    margin-top:14px; background: var(--surface-3); border:1px solid var(--border);
    color: var(--text); font-family: var(--font-body); font-weight:600; font-size:13px;
    padding: 9px 16px; border-radius:7px; cursor:pointer;
  }
  .verdict.pass ~ .confirm-btn, .confirm-btn.pass{ border-color: var(--pass); color: var(--pass); }
  .confirm-btn:hover{ filter: brightness(1.2); }
  .zone-label-row{ display:flex; align-items:center; justify-content:space-between; }
  .clear-zone-btn{
    background:none; border:none; color: var(--text-faint); font-size:11px; cursor:pointer;
    padding:2px 4px; font-family: var(--font-body); text-decoration: underline;
  }
  .clear-zone-btn:hover{ color: var(--fail); }
  .mismatch-list{ margin-top:12px; display:flex; flex-direction:column; gap:8px; }
  .mismatch-item{
    background: var(--surface-2); border:1px solid var(--border-soft); border-left:3px solid var(--fail);
    border-radius:7px; padding:10px 12px;
  }
  .mismatch-item.warn-item{ border-left-color: var(--warn); }
  .mismatch-item .mi-title{ font-size:12.5px; font-weight:600; color:#f0b3af; margin-bottom:6px; display:flex; align-items:center; gap:6px; }
  .mismatch-item.warn-item .mi-title{ color:#f0d2a3; }
  .mismatch-item .mi-note{ font-size:12px; color: var(--text-dim); margin-top:6px; font-style:italic; }
  .mismatch-item .mi-compare{ display:flex; gap:22px; font-family: var(--font-mono); font-size:12px; }
  .mi-col .mi-col-label{ font-family: var(--font-body); color: var(--text-faint); font-size:10.5px; text-transform:uppercase; letter-spacing:0.3px; margin-bottom:2px; }
  .mi-col .mi-col-val{ color: var(--text); }

  .loading-row{ display:flex; align-items:center; gap:10px; padding:14px 0; font-size:12.5px; color: var(--text-dim); }
  .spinner{
    width:15px; height:15px; border-radius:50%; border:2px solid var(--surface-3);
    border-top-color: var(--primary); animation: spin 0.7s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .add-set-btn{
    width:100%; padding: 14px; border-radius: var(--radius); border:1.5px dashed var(--border);
    background: transparent; color: var(--text-dim); font-family: var(--font-body); font-size:13.5px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .add-set-btn:hover{ border-color: var(--primary); color: var(--text); background: rgba(111,155,209,0.05); }

  /* Bottom bar */
  .bottom-bar{
    position: fixed; bottom:0; left:0; right:0; z-index: 50;
    background: rgba(20,27,36,0.92); backdrop-filter: blur(10px);
    border-top: 1px solid var(--border-soft);
    padding: 14px 24px;
  }
  .bottom-bar-inner{
    max-width: 980px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  .summary-strip{ display:flex; gap:16px; font-size:12.5px; color: var(--text-dim); flex-wrap:wrap; }
  .summary-strip span b{ color: var(--text); }
  .check-btn{
    background: linear-gradient(150deg, var(--primary), #4a7ab8);
    color: #0d151d; font-weight:600; font-family: var(--font-body); font-size:14px;
    border:none; border-radius:9px; padding: 12px 26px; cursor:pointer;
    box-shadow: 0 2px 14px rgba(111,155,209,0.25);
    display:flex; align-items:center; gap:8px; flex-shrink:0;
  }
  .check-btn:hover{ filter: brightness(1.08); }
  .check-btn:disabled{ opacity:0.55; cursor:not-allowed; filter:none; }
  .check-btn .spinner{ border-top-color: #0d151d; border-color: rgba(13,21,29,0.3); }

  .export-btn{
    background: var(--surface-2); border:1px solid var(--border);
    color: var(--text); font-weight:600; font-family: var(--font-body); font-size:13.5px;
    border-radius:9px; padding: 11px 20px; cursor:pointer;
    display:flex; align-items:center; gap:8px; flex-shrink:0;
  }
  .export-btn:hover{ border-color: var(--primary); background: var(--primary-dim); }
  .export-btn:disabled{ opacity:0.4; cursor:not-allowed; }

  .progress-track{
    width:100%; height:4px; border-radius:3px; background: var(--surface-3);
    overflow:hidden; margin-bottom:10px; display:none;
  }
  .progress-track.active{ display:block; }
  .progress-fill{
    height:100%; width:0%; background: linear-gradient(90deg, var(--primary), #4a7ab8);
    transition: width 0.25s ease;
  }
  .progress-label{
    font-size:11.5px; color: var(--text-dim); margin-bottom:8px; display:none; font-family: var(--font-mono);
  }
  .progress-label.active{ display:block; }

  .global-error{
    background: var(--fail-dim); border:1px solid var(--fail); color:#f3c9c6;
    font-size:12.5px; padding:10px 14px; border-radius:8px; margin-bottom:16px;
    display:flex; align-items:center; gap:8px;
  }

  input[type=file]{ display:none; }
</style>
</head>
<body>

--------------------------------------------------------- */
const FIELD_LIBRARY = {
  netWeight:      { label: "Net weight", unit: "kg", type: "number" },
  grossWeight:    { label: "Gross weight", unit: "kg", type: "number" },
  currency:       { label: "Currency", type: "text" },
  totalAmount:    { label: "Total amount", type: "number" },
  incoterms:      { label: "Incoterms", type: "text", hint: "Extract ONLY the 3-letter Incoterms rule code (e.g. FOB, EXW, CIP, FCA, CIF, CFR, CPT, DAP, DPU, DDP, FAS). Do NOT include the named place or port that follows it — e.g. if the document says 'FOB Qingdao', return just 'FOB'." },
  totalQuantity:  { label: "Total quantity of goods", type: "number", hint: "The total quantity of goods/units for the entire shipment (e.g. total pieces, PCS, or quantity of items) — NOT the number of physical cartons, boxes, or 'outer cartons' used for packing, which is a different metric. If a document shows both a goods quantity total (e.g. 'Total PCS', 'Quantity') AND a separate cartons/packages total (e.g. 'Outer Cartons', 'Total Cartons'), always use the goods quantity total, never the carton/package count. Many documents list several goods items (line items) each with their own quantity — if there is no single explicit grand total for quantity, ADD UP the quantity of every line item yourself. Do not use just one line item's value." },
  originCountry:  { label: "Country of origin", type: "text" },
  destCountry:    { label: "Country of destination (customs declaration)", type: "text", hint: "Only extract this if the document has an EXPLICIT formal 'country of destination' field (e.g. customs declaration box 17, 'Rendeltetési ország', 'Land van bestemming', 'Pays de destination'). This is a formal customs classification that may legitimately differ from the actual recipient's country (e.g. when a customs broker clears goods for onward intra-EU movement). Do NOT derive this from an address, and do NOT use a 'Port of discharge' or 'Country of final discharge' field. If the document has no such explicit field, return null — do not guess." },
  recipientCountry: { label: "Recipient country", type: "text", hint: "The country of the actual Importer / Consignee / Buyer (the party receiving and owning the goods) — derive this from their address. Do NOT use the Declarant's or Representative's country (a customs broker/agent filing paperwork on someone else's behalf, often based in a different country than the actual buyer), and do NOT use a 'Port of discharge' field." },
  invoiceNumber:  { label: "Invoice number", type: "text", hint: "May not be explicitly labeled 'invoice number'. On EU customs declarations it is very often referenced under a supporting/previous document entry using the code 'N380' (the EU code for 'invoice') followed by the reference number — e.g. a line reading 'N380 J26HSZ038' means the invoice number is J26HSZ038. Also check labels in other languages, e.g. 'Alátámasztó okmányok', 'Faktura', 'Numer faktury'." },
  pluNumber:      { label: "PLU number", type: "text", missingLabel: "Not specified" },
  shipperAddress:   { label: "Sender address", type: "text" },
  recipientAddress: { label: "Recipient address", type: "text" },
  hsCode:         { label: "HS code", type: "text" },
  hsDescription:  { label: "HS code description", type: "text" },
};

function defaultRules(){
  return [
    { id: "r_net", field: "netWeight", label: "Net weight matches", compare: "numeric", tolerance: 0.5, enabled: true, builtin: true },
    { id: "r_gross", field: "grossWeight", label: "Gross weight matches", compare: "numeric", tolerance: 0.5, enabled: true, builtin: true },
    { id: "r_gross_ge_net", field: "grossWeight", label: "Gross weight not lower than net weight", compare: "gte_internal", against: "netWeight", enabled: true, builtin: true },
    { id: "r_currency", field: "currency", label: "Currency matches", compare: "text", enabled: true, builtin: true },
    { id: "r_amount", field: "totalAmount", label: "Total amount matches", compare: "numeric", tolerance: 0.01, enabled: true, builtin: true },
    { id: "r_incoterms", field: "incoterms", label: "Incoterms match", compare: "text", enabled: true, builtin: true },
    { id: "r_packages", field: "totalQuantity", label: "Total quantity matches", compare: "numeric", tolerance: 0, enabled: true, builtin: true },
    { id: "r_origin", field: "originCountry", label: "Country of origin matches", compare: "text", enabled: true, builtin: true },
    { id: "r_dest", field: "destCountry", label: "Country of destination matches (customs declaration)", compare: "text", enabled: true, builtin: true },
    { id: "r_recipient_country", field: "recipientCountry", label: "Recipient country matches", compare: "text", enabled: true, builtin: true },
    { id: "r_invoice", field: "invoiceNumber", label: "Invoice number matches", compare: "text", enabled: true, builtin: true },
    { id: "r_plu", field: "pluNumber", label: "PLU number matches", compare: "text", enabled: true, builtin: true },
    { id: "r_shipper", field: "shipperAddress", label: "Sender address matches", compare: "ai_semantic", enabled: true, builtin: true },
    { id: "r_recipient", field: "recipientAddress", label: "Recipient address matches", compare: "ai_semantic", enabled: true, builtin: true },
    { id: "r_hs", field: "hsCode", label: "HS code matches its description", compare: "hs_plausibility", enabled: true, builtin: true },
  ];
}

/* ---------------------------------------------------------
   State
--------------------------------------------------------- */
let state = {
  rules: defaultRules(),
  sets: [],
  rulesOpen: false,
};

function uid(prefix){ return prefix + "_" + Math.random().toString(36).slice(2, 9); }

function newSet(){
  return {
    id: uid("set"),
    customName: null,  // null = use auto "N. Document set" based on position
    sourceFiles: [],
    reviewFiles: [],
    status: "idle",   // idle | checking | done
    error: null,
    result: null,     // { extractedSource, extractedReview, comparisons, overallPass }
  };
}

function resetApp(){
  state.sets = [newSet()];
  showGlobalError(null);
  const exportBtn = document.getElementById("exportBtn");
  if(exportBtn) exportBtn.disabled = true;
  renderSets();
}

/* ---------------------------------------------------------
   Rendering: rules panel
--------------------------------------------------------- */
function renderRules(){
  const activeCount = state.rules.filter(r => r.enabled).length;
  document.getElementById("ruleCountBadge").textContent = activeCount + " active";

  const body = document.getElementById("rulesBody");
  body.classList.toggle("open", state.rulesOpen);
  document.getElementById("rulesChevron").classList.toggle("open", state.rulesOpen);

  let html = "";
  state.rules.forEach(rule => {
    const fieldMeta = FIELD_LIBRARY[rule.field] || { label: rule.field };
    let metaText = "";
    if(rule.compare === "numeric") metaText = "numeric match" + (rule.tolerance ? " · ±" + rule.tolerance + (fieldMeta.unit || "") : "");
    else if(rule.compare === "text") metaText = "text match";
    else if(rule.compare === "gte_internal") metaText = "internal consistency check";
    else if(rule.compare === "hs_plausibility") metaText = "AI plausibility check (not a tariff lookup)";
    else if(rule.compare === "ai_semantic") metaText = "AI semantic match (ignores formatting differences)";
    html += `
      <div class="rule-row" data-rule="${rule.id}">
        <div class="toggle ${rule.enabled ? 'on':''}" data-action="toggle-rule" data-id="${rule.id}"><div class="toggle-dot"></div></div>
        <div class="rule-label">
          <div class="name">${rule.label}</div>
          <div class="meta">${metaText}</div>
        </div>
        <div class="rule-tag">${fieldMeta.label}</div>
        ${rule.builtin ? "" : `<button class="rule-remove" data-action="remove-rule" data-id="${rule.id}">✕</button>`}
      </div>`;
  });

  html += `<button class="add-rule-btn" id="addRuleBtn">+ Add custom rule</button>`;
  html += `<div id="addRuleFormSlot"></div>`;
  body.innerHTML = html;
}

function renderAddRuleForm(){
  const slot = document.getElementById("addRuleFormSlot");
  slot.innerHTML = `
    <div class="add-rule-form">
      <div class="row">
        <input type="text" id="newRuleLabel" placeholder="Rule name (e.g. Invoice number matches)" />
      </div>
      <div class="row">
        <input type="text" id="newRuleField" placeholder="Field to extract (e.g. invoice date)" />
        <select id="newRuleCompare">
          <option value="text">Text match (exact)</option>
          <option value="numeric">Numeric match</option>
          <option value="ai_semantic">AI match (ignores formatting)</option>
        </select>
      </div>
      <div class="form-actions">
        <button class="btn-small" id="cancelRuleBtn">Cancel</button>
        <button class="btn-small primary" id="saveRuleBtn">Add rule</button>
      </div>
    </div>`;
  document.getElementById("cancelRuleBtn").onclick = () => { slot.innerHTML = ""; };
  document.getElementById("saveRuleBtn").onclick = () => {
    const label = document.getElementById("newRuleLabel").value.trim();
    const fieldRaw = document.getElementById("newRuleField").value.trim();
    const compare = document.getElementById("newRuleCompare").value;
    if(!label || !fieldRaw){ return; }
    const fieldKey = "custom_" + fieldRaw.toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"");
    FIELD_LIBRARY[fieldKey] = { label: fieldRaw, type: compare === "numeric" ? "number" : "text" };
    state.rules.push({ id: uid("rule"), field: fieldKey, label, compare, tolerance: compare==="numeric"?0.01:undefined, enabled: true, builtin: false });
    renderRules();
  };
}

document.getElementById("rulesHeader").onclick = () => {
  state.rulesOpen = !state.rulesOpen;
  renderRules();
};

document.getElementById("rulesBody").addEventListener("click", (e) => {
  const t = e.target.closest("[data-action]");
  if(!t) return;
  const action = t.dataset.action;
  const id = t.dataset.id;
  if(action === "toggle-rule"){
    const r = state.rules.find(r => r.id === id);
    r.enabled = !r.enabled;
    renderRules();
  } else if(action === "remove-rule"){
    state.rules = state.rules.filter(r => r.id !== id);
    renderRules();
  }
});
document.getElementById("rulesBody").addEventListener("click", (e) => {
  if(e.target.id === "addRuleBtn") renderAddRuleForm();
});

/* ---------------------------------------------------------
   Rendering: document sets
--------------------------------------------------------- */
function fileIcon(file){
  if(file.type === "application/pdf") return "▤";
  return "▧";
}

function renderSets(){
  const container = document.getElementById("setsContainer");
  document.getElementById("setCount").textContent = state.sets.length;
  if(state.sets.length === 0){
    container.innerHTML = `<div style="text-align:center; padding: 40px 10px; color: var(--text-faint); font-size:13px;">
      No document sets yet. Add one to get started.
    </div>`;
    return;
  }
  container.innerHTML = state.sets.map((s, i) => renderSetCard(s, i)).join("");
  state.sets.forEach((s, i) => bindSetEvents(s, i));
}

function renderFileChips(files, setId, zone){
  if(files.length === 0) return "";
  return `<div class="file-chip-list">` + files.map((f, idx) => `
    <div class="file-chip">
      <span class="file-chip-icon">${fileIcon(f.file)}</span>
      <span class="file-chip-name">${f.file.name}</span>
      <button class="file-chip-remove" data-action="remove-file" data-set="${setId}" data-zone="${zone}" data-idx="${idx}">✕</button>
    </div>`).join("") + `</div>`;
}

function renderExtractTable(set){
  if(!set.result) return "";
  const rows = set.result.comparisons.map(c => {
    const icon = c.status === "pass" ? `<span class="status-icon ok">✓</span>`
               : c.status === "fail" ? `<span class="status-icon bad">✕</span>`
               : c.status === "warn" ? `<span class="status-icon warn">!</span>`
               : `<span class="status-icon na">–</span>`;
    const missingText = (FIELD_LIBRARY[c.field] && FIELD_LIBRARY[c.field].missingLabel) || "not found";
    const sv = c.sourceValue === null || c.sourceValue === undefined || c.sourceValue === ""
      ? `<span class="val-missing">${missingText}</span>` : `<span class="val-source">${c.sourceValue}</span>`;
    const rv = c.reviewValue === null || c.reviewValue === undefined || c.reviewValue === ""
      ? `<span class="val-missing">${missingText}</span>` : `<span class="val-review">${c.reviewValue}</span>`;
    return `<tr>
      <td class="field-name">${c.label}</td>
      <td>${sv}</td>
      <td>${rv}</td>
      <td>${icon}</td>
    </tr>`;
  }).join("");

  return `
    <div class="extract-section">
      <div class="extract-title">Extracted &amp; compared data</div>
      <table class="manifest-table">
        <thead><tr><th>Field</th><th>Source documents</th><th>Document under review</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function renderVerdict(set){
  if(!set.result) return "";
  const comparisons = set.result.comparisons;
  const failCount = comparisons.filter(c => c.status === "fail").length;
  const warnItems = comparisons.filter(c => c.status === "warn");
  const mismatches = comparisons.filter(c => c.status === "fail");
  const verdictClass = failCount > 0 ? "fail" : (warnItems.length > 0 ? "warn" : "pass");
  const stampChar = failCount > 0 ? "✕" : (warnItems.length > 0 ? "!" : "✓");
  let headline;
  if(failCount > 0) headline = failCount + " discrepanc" + (failCount===1?"y":"ies") + " found";
  else if(warnItems.length > 0) headline = "OK, with " + warnItems.length + " item" + (warnItems.length===1?"":"s") + " to double-check";
  else headline = "OK — no discrepancies found";
  const subtext = failCount > 0 ? "Review the fields below."
    : warnItems.length > 0 ? "No hard mismatches, but see the notes below."
    : "All active rules passed for this document set.";

  let html = `
    <div class="verdict ${verdictClass}">
      <div class="stamp">${stampChar}</div>
      <div class="verdict-text">
        <b>${headline}</b>
        <span>${subtext}</span>
      </div>
    </div>`;

  if(mismatches.length > 0){
    html += `<div class="mismatch-list">` + mismatches.map(m => `
      <div class="mismatch-item">
        <div class="mi-title">✕ ${m.label}</div>
        <div class="mi-compare">
          <div class="mi-col"><div class="mi-col-label">Source</div><div class="mi-col-val">${m.sourceValue ?? "—"}</div></div>
          <div class="mi-col"><div class="mi-col-label">Document under review</div><div class="mi-col-val">${m.reviewValue ?? "—"}</div></div>
        </div>
        ${m.note ? `<div class="mi-note">${m.note}</div>` : ""}
      </div>`).join("") + `</div>`;
  }
  if(warnItems.length > 0){
    html += `<div class="mismatch-list">` + warnItems.map(w => `
      <div class="mismatch-item warn-item">
        <div class="mi-title">! ${w.label}</div>
        <div class="mi-compare">
          <div class="mi-col"><div class="mi-col-label">Source</div><div class="mi-col-val">${w.sourceValue ?? "—"}</div></div>
          <div class="mi-col"><div class="mi-col-label">Document under review</div><div class="mi-col-val">${w.reviewValue ?? "—"}</div></div>
        </div>
        ${w.note ? `<div class="mi-note">${w.note}</div>` : ""}
      </div>`).join("") + `</div>`;
  }
  html += `<button class="confirm-btn ${verdictClass === 'fail' ? '' : 'pass'}" data-action="confirm-results">Confirm results</button>`;
  return html;
}

function renderSetCard(set, pos){
  const displayNumber = pos + 1;
  const title = set.customName !== null ? set.customName : (displayNumber + ". Document set");
  const removable = pos > 0;
  const errorHtml = set.error ? `<div class="set-error">⚠ ${set.error}</div>` : "";
  let bottomHtml = "";
  if(set.status === "checking"){
    bottomHtml = `<div class="loading-row"><div class="spinner"></div> Extracting and comparing documents…</div>`;
  } else if(set.status === "done" && set.result){
    bottomHtml = renderExtractTable(set) + renderVerdict(set);
  }

  return `
    <div class="set-card" data-set="${set.id}">
      <div class="set-head">
        <div class="set-title-wrap">
          <div class="set-index">${displayNumber}</div>
          <input class="set-title" value="${title}" data-action="rename-set" data-set="${set.id}" />
        </div>
        ${removable ? `<button class="set-remove" data-action="remove-set" data-set="${set.id}">Remove</button>` : ""}
      </div>
      <div class="set-body">
        <div class="upload-grid">
          <div class="upload-zone" data-zone="source" data-set="${set.id}">
            <div class="zone-label-row">
              <div class="upload-zone-label">Original documents</div>
              ${set.sourceFiles.length ? `<button class="clear-zone-btn" data-action="clear-zone" data-zone="source" data-set="${set.id}">Clear all</button>` : ""}
            </div>
            <div class="upload-zone-hint">Invoice, packing list, etc. — multiple files allowed</div>
            <div class="drop-inner" data-action="open-picker" data-zone="source" data-set="${set.id}">
              <div class="drop-icon">⇧</div>
              <div class="drop-text"><b>Click to upload</b> or drag files here</div>
            </div>
            ${renderFileChips(set.sourceFiles, set.id, "source")}
          </div>
          <div class="upload-zone" data-zone="review" data-set="${set.id}">
            <div class="zone-label-row">
              <div class="upload-zone-label">Document under review</div>
              ${set.reviewFiles.length ? `<button class="clear-zone-btn" data-action="clear-zone" data-zone="review" data-set="${set.id}">Clear all</button>` : ""}
            </div>
            <div class="upload-zone-hint">Import / export customs document</div>
            <div class="drop-inner" data-action="open-picker" data-zone="review" data-set="${set.id}">
              <div class="drop-icon">⇧</div>
              <div class="drop-text"><b>Click to upload</b> or drag files here</div>
            </div>
            ${renderFileChips(set.reviewFiles, set.id, "review")}
          </div>
        </div>
        ${errorHtml}
        ${bottomHtml}
      </div>
    </div>`;
}

function bindSetEvents(set, pos){
  const card = document.querySelector(`.set-card[data-set="${set.id}"]`);
  if(!card) return;

  card.querySelectorAll('[data-action="open-picker"]').forEach(el => {
    el.addEventListener("click", () => {
      const input = document.createElement("input");
      input.type = "file"; input.multiple = true; input.accept = "application/pdf,image/*";
      input.onchange = (e) => addFiles(set.id, el.dataset.zone, Array.from(e.target.files));
      input.click();
    });
  });

  card.querySelectorAll(".upload-zone").forEach(zoneEl => {
    zoneEl.addEventListener("dragover", (e) => { e.preventDefault(); zoneEl.classList.add("drag"); });
    zoneEl.addEventListener("dragleave", () => zoneEl.classList.remove("drag"));
    zoneEl.addEventListener("drop", (e) => {
      e.preventDefault(); zoneEl.classList.remove("drag");
      addFiles(set.id, zoneEl.dataset.zone, Array.from(e.dataTransfer.files));
    });
  });

  card.querySelectorAll('[data-action="remove-file"]').forEach(btn => {
    btn.addEventListener("click", () => {
      const s = state.sets.find(s => s.id === btn.dataset.set);
      const list = btn.dataset.zone === "source" ? s.sourceFiles : s.reviewFiles;
      list.splice(Number(btn.dataset.idx), 1);
      renderSets();
    });
  });

  card.querySelectorAll('[data-action="clear-zone"]').forEach(btn => {
    btn.addEventListener("click", () => {
      const s = state.sets.find(s => s.id === btn.dataset.set);
      if(btn.dataset.zone === "source") s.sourceFiles = []; else s.reviewFiles = [];
      renderSets();
    });
  });

  const confirmBtn = card.querySelector('[data-action="confirm-results"]');
  if(confirmBtn) confirmBtn.addEventListener("click", resetApp);

  const removeBtn = card.querySelector('[data-action="remove-set"]');
  if(removeBtn) removeBtn.addEventListener("click", () => {
    state.sets = state.sets.filter(s => s.id !== set.id);
    renderSets();
  });

  const titleInput = card.querySelector('[data-action="rename-set"]');
  if(titleInput) titleInput.addEventListener("change", () => {
    set.customName = titleInput.value.trim() || null;
    renderSets();
  });
}

function addFiles(setId, zone, files){
  const set = state.sets.find(s => s.id === setId);
  if(!set) return;
  files.forEach(file => {
    const target = zone === "source" ? set.sourceFiles : set.reviewFiles;
    target.push({ file });
  });
  set.error = null;
  renderSets();
}

/* ---------------------------------------------------------
   Add / remove sets
--------------------------------------------------------- */
document.getElementById("addSetBtn").addEventListener("click", () => {
  state.sets.push(newSet());
  renderSets();
});

/* ---------------------------------------------------------
   File -> base64
--------------------------------------------------------- */
function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------------------------------------------------------
   Extraction via Claude API
--------------------------------------------------------- */
async function extractFromFile(fileWrap, activeFields){
  const file = fileWrap.file;
  const base64 = await fileToBase64(file);
  const isPdf = file.type === "application/pdf";
  const contentBlock = isPdf
    ? { type: "document", source: { type: "base64", media_type: "application/pdf", data: base64 } }
    : { type: "image", source: { type: "base64", media_type: file.type || "image/png", data: base64 } };

  const fieldDescriptions = activeFields.map(key => {
    const meta = FIELD_LIBRARY[key];
    let line = `- ${key}: ${meta.label}${meta.unit ? " (unit: " + meta.unit + ")" : ""}`;
    if(meta.hint) line += ` — ${meta.hint}`;
    return line;
  }).join("\n");

  const systemPrompt = `You are extracting structured data from a trade / customs document (invoice, packing list, or import/export customs declaration). The document may be in English, Czech, Hungarian, Polish, Romanian, Slovenian, or Croatian. Find the following fields regardless of the language of the label used in the document:
${fieldDescriptions}

IMPORTANT — read the whole document carefully before answering:
- Many customs declarations and invoices list multiple separate goods items (line items), each on its own with its own quantity, weight, and value — sometimes across several pages. Go through every single line item on every page; do not stop at the first one you see.
- For any field that represents a total for the entire shipment/document (e.g. total quantity, total number of packages), first check if the document already states an explicit grand total. If it does not, you must calculate the total yourself by adding together the corresponding value from every line item. Double-check your addition before answering — do not guess or use a single line item's value as if it were the total.
- Be careful not to confuse a per-item sub-value (such as a colli/carton/package count that belongs to only one line item) with the shipment-wide total being asked for.
- If a document-level total field already exists and states the total explicitly, prefer that stated total over your own manual sum.

Do any counting, adding, or reasoning silently in your head — do NOT write it out. Respond with ONLY a JSON object and absolutely nothing else: no explanation, no markdown formatting, no notes, no shown arithmetic, no text before or after the JSON. The entire response must be a single valid JSON object mapping each field key above to its value found in the document, or null if not present. Numbers should be plain numbers (no thousands separators, use "." as decimal separator). Country names should be normalized to English if possible. Currency should be the 3-letter ISO code if identifiable (e.g. EUR, CZK, PLN).`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1500,
      system: systemPrompt,
      messages: [{ role: "user", content: [contentBlock, { type: "text", text: "Extract the fields as instructed." }] }],
    }),
  });

  let data;
  try{
    data = await response.json();
  } catch(e){
    throw new Error(`Failed to read "${file.name}": the server did not return a valid response (HTTP ${response.status}).`);
  }

  if(!response.ok || data.error){
    const reason = data?.error?.message || `HTTP ${response.status}`;
    throw new Error(`Failed to read "${file.name}": ${reason}`);
  }

  const textBlock = (data.content || []).find(b => b.type === "text");
  if(!textBlock || !textBlock.text){
    throw new Error(`Failed to read "${file.name}": no data was returned for this document.`);
  }

  let parsed;
  try{
    let cleaned = textBlock.text.replace(/```json|```/g, "").trim();
    const firstBrace = cleaned.indexOf("{");
    const lastBrace = cleaned.lastIndexOf("}");
    if(firstBrace !== -1 && lastBrace !== -1 && lastBrace > firstBrace){
      cleaned = cleaned.slice(firstBrace, lastBrace + 1);
    }
    parsed = JSON.parse(cleaned);
  } catch(e){
    throw new Error(`Failed to read "${file.name}": the extracted data could not be understood. Try re-uploading this file.`);
  }
  return parsed;
}

function normalizeLoose(v){
  if(v === null || v === undefined) return "";
  return String(v).trim().toLowerCase().replace(/[.,;:]/g, "").replace(/\s+/g, " ").trim();
}

function mergeWithConflicts(fileNames, extractions){
  const merged = {};
  const perField = {};
  extractions.forEach((obj, idx) => {
    Object.keys(obj || {}).forEach(k => {
      const v = obj ? obj[k] : null;
      if(v === null || v === undefined || v === "") return;
      if(!perField[k]) perField[k] = [];
      perField[k].push({ fileName: fileNames[idx] || `File ${idx+1}`, value: v });
      if(merged[k] === undefined) merged[k] = v;
    });
  });
  const conflicts = [];
  Object.keys(perField).forEach(k => {
    const entries = perField[k];
    if(entries.length < 2) return;
    const meta = FIELD_LIBRARY[k] || {};
    const isNumeric = meta.type === "number";
    let hasConflict = false;
    for(let i = 1; i < entries.length; i++){
      if(isNumeric){
        const tol = 0.5;
        if(Math.abs(Number(entries[i].value) - Number(entries[0].value)) > tol) hasConflict = true;
      } else {
        if(normalizeLoose(entries[i].value) !== normalizeLoose(entries[0].value)) hasConflict = true;
      }
    }
    if(hasConflict) conflicts.push({ field: k, entries });
  });
  return { merged, conflicts };
}

/* ---------------------------------------------------------
   HS code plausibility check (not a real tariff lookup —
   an AI judgment call on whether the code and description
   are in the same ballpark)
--------------------------------------------------------- */
async function checkHsPlausibility(code, description){
  const systemPrompt = `You are an experienced customs classification reviewer. You will be given an HS (Harmonized System) tariff code and a goods description that is claimed to go with it. Judge only whether the code and the description are broadly plausible together (roughly the same category of goods) — you are not looking up an official tariff schedule, just applying general knowledge of what typical HS chapters/headings cover. Only flag a mismatch if the description clearly does not belong to the category implied by the code (e.g. a code for "live animals" paired with a description of "steel bolts").

Respond with ONLY a JSON object: {"verdict": "plausible" or "mismatch", "note": "one short sentence explaining your reasoning, in plain English"}. No markdown, no extra text.`;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 300,
        system: systemPrompt,
        messages: [{ role: "user", content: `HS code: ${code}\nDescription: ${description}` }],
      }),
    });
    const data = await response.json();
    const textBlock = (data.content || []).find(b => b.type === "text");
    const cleaned = (textBlock?.text || "{}").replace(/```json|```/g, "").trim();
    const parsed = JSON.parse(cleaned);
    return {
      mismatch: parsed.verdict === "mismatch",
      note: parsed.note || "",
    };
  } catch(e){
    return { mismatch: false, note: "", failed: true };
  }
}

/* ---------------------------------------------------------
   Generic AI semantic comparison (e.g. addresses) — judges
   whether two values refer to the same real-world thing
   despite formatting differences (line breaks, postal code
   spacing, abbreviations, word order, country name vs code).
--------------------------------------------------------- */
async function checkSemanticMatch(label, valueA, valueB){
  const systemPrompt = `You compare two text values extracted from trade/customs documents (field: "${label}") to judge whether they refer to the same real-world thing, despite differences in formatting: line breaks, punctuation, word order, postal code spacing (e.g. "61900" vs "619 00"), abbreviations, or country name vs ISO country code. Ignore harmless formatting differences. Only flag it as NOT matching if there is a genuine factual difference — a different street, house number, city, or company name.

Respond with ONLY a JSON object: {"match": true or false, "note": "short reason if not matching, otherwise empty string"}. No markdown, no extra text.`;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 300,
        system: systemPrompt,
        messages: [{ role: "user", content: `Value A: ${valueA}\nValue B: ${valueB}` }],
      }),
    });
    const data = await response.json();
    const textBlock = (data.content || []).find(b => b.type === "text");
    const cleaned = (textBlock?.text || "{}").replace(/```json|```/g, "").trim();
    const parsed = JSON.parse(cleaned);
    return {
      match: parsed.match !== false,
      note: parsed.note || "",
    };
  } catch(e){
    return { match: true, note: "", failed: true };
  }
}

/* ---------------------------------------------------------
   Comparison logic
--------------------------------------------------------- */
function normalizeText(v){
  if(v === null || v === undefined) return "";
  return String(v).trim().toLowerCase().replace(/\s+/g, " ");
}

function normalizeIncoterms(v){
  if(v === null || v === undefined) return "";
  const s = String(v).trim().toUpperCase();
  const match = s.match(/^[A-Z]{3,4}/);
  return match ? match[0] : s;
}

function compareValues(rule, sourceData, reviewData){
  const meta = FIELD_LIBRARY[rule.field] || { label: rule.field };
  const label = rule.label;

  if(rule.compare === "gte_internal"){
    const a = reviewData[rule.field];
    const b = reviewData[rule.against];
    if(a === null || a === undefined || b === null || b === undefined){
      return { field: rule.field, label, sourceValue: null, reviewValue: (a ?? null), status: "na" };
    }
    const pass = Number(a) >= Number(b);
    return {
      field: rule.field,
      label,
      sourceValue: `net: ${b}${meta.unit||''}`,
      reviewValue: `gross: ${a}${meta.unit||''}`,
      status: pass ? "pass" : "fail",
    };
  }

  const sv = sourceData[rule.field];
  const rv = reviewData[rule.field];
  const svDisplay = sv !== undefined && sv !== null && sv !== "" ? (meta.unit ? `${sv} ${meta.unit}` : sv) : null;
  const rvDisplay = rv !== undefined && rv !== null && rv !== "" ? (meta.unit ? `${rv} ${meta.unit}` : rv) : null;

  if((sv === undefined || sv === null || sv === "") || (rv === undefined || rv === null || rv === "")){
    return { field: rule.field, label, sourceValue: svDisplay, reviewValue: rvDisplay, status: "na" };
  }

  let pass = false;
  if(rule.compare === "numeric"){
    const diff = Math.abs(Number(sv) - Number(rv));
    pass = diff <= (rule.tolerance ?? 0);
  } else if(rule.field === "incoterms"){
    pass = normalizeIncoterms(sv) === normalizeIncoterms(rv);
  } else {
    pass = normalizeText(sv) === normalizeText(rv);
  }
  return { field: rule.field, label, sourceValue: svDisplay, reviewValue: rvDisplay, status: pass ? "pass" : "fail" };
}

/* ---------------------------------------------------------
   Run checks
--------------------------------------------------------- */
function showGlobalError(msg){
  const slot = document.getElementById("globalErrorSlot");
  if(!msg){ slot.innerHTML = ""; return; }
  slot.innerHTML = `<div class="global-error">⚠ ${msg}</div>`;
}

async function checkAllSets(){
  showGlobalError(null);
  if(state.sets.length === 0){
    showGlobalError("Add at least one document set before running a check.");
    return;
  }

  let hasMissing = false;
  state.sets.forEach(set => {
    set.error = null;
    if(set.sourceFiles.length === 0 || set.reviewFiles.length === 0){
      set.error = "This set needs at least one original document and one document under review.";
      hasMissing = true;
    }
  });
  renderSets();
  if(hasMissing){
    showGlobalError("Some document sets are missing required files. Fix the highlighted sets below and try again.");
    return;
  }

  const activeRules = state.rules.filter(r => r.enabled);
  const hsRule = activeRules.find(r => r.compare === "hs_plausibility");
  const semanticRules = activeRules.filter(r => r.compare === "ai_semantic");
  const standardRules = activeRules.filter(r => r.compare !== "hs_plausibility" && r.compare !== "ai_semantic");
  const activeFields = Array.from(new Set(
    activeRules.flatMap(r => {
      const fs = [r.field, r.against].filter(Boolean);
      if(r.compare === "hs_plausibility") fs.push("hsDescription");
      return fs;
    })
  ));

  // Progress tracking: count planned async steps across all sets
  let totalSteps = 0;
  state.sets.forEach(set => {
    totalSteps += set.sourceFiles.length + set.reviewFiles.length;
    if(hsRule) totalSteps += 1;
    totalSteps += semanticRules.length;
  });
  let completedSteps = 0;
  const progressTrack = document.getElementById("progressTrack");
  const progressFill = document.getElementById("progressFill");
  const progressLabel = document.getElementById("progressLabel");
  function bumpProgress(){
    completedSteps += 1;
    const pct = totalSteps > 0 ? Math.min(100, Math.round((completedSteps / totalSteps) * 100)) : 100;
    progressFill.style.width = pct + "%";
    progressLabel.textContent = "Checking… " + pct + "%";
  }
  progressTrack.classList.add("active");
  progressLabel.classList.add("active");
  progressFill.style.width = "0%";
  progressLabel.textContent = "Checking… 0%";

  const checkBtn = document.getElementById("checkAllBtn");
  checkBtn.disabled = true;
  checkBtn.innerHTML = `<div class="spinner"></div> Checking…`;
  document.getElementById("exportBtn").disabled = true;

  for(const set of state.sets){
    set.status = "checking";
    renderSets();
    try{
      const sourceExtractions = await Promise.all(set.sourceFiles.map(f => extractFromFile(f, activeFields).then(r => { bumpProgress(); return r; })));
      const reviewExtractions = await Promise.all(set.reviewFiles.map(f => extractFromFile(f, activeFields).then(r => { bumpProgress(); return r; })));
      const sourceFileNames = set.sourceFiles.map(f => f.file.name);
      const reviewFileNames = set.reviewFiles.map(f => f.file.name);
      const { merged: sourceData, conflicts: sourceConflicts } = mergeWithConflicts(sourceFileNames, sourceExtractions);
      const { merged: reviewData, conflicts: reviewConflicts } = mergeWithConflicts(reviewFileNames, reviewExtractions);
      const comparisons = standardRules.map(r => compareValues(r, sourceData, reviewData));

      if(hsRule){
        const code = reviewData.hsCode || sourceData.hsCode;
        const desc = reviewData.hsDescription || sourceData.hsDescription;
        const svDisplay = sourceData.hsCode ? `${sourceData.hsCode}${sourceData.hsDescription ? " — " + sourceData.hsDescription : ""}` : null;
        const rvDisplay = reviewData.hsCode ? `${reviewData.hsCode}${reviewData.hsDescription ? " — " + reviewData.hsDescription : ""}` : null;
        if(code && desc){
          const verdict = await checkHsPlausibility(code, desc);
          bumpProgress();
          comparisons.push({
            field: "hsCode",
            label: hsRule.label,
            sourceValue: svDisplay,
            reviewValue: rvDisplay,
            status: verdict.mismatch ? "warn" : "pass",
            note: verdict.mismatch ? "Recommend verifying the accuracy of the HS code description." : (verdict.failed ? "" : verdict.note),
          });
        } else {
          bumpProgress();
          comparisons.push({ field: "hsCode", label: hsRule.label, sourceValue: svDisplay, reviewValue: rvDisplay, status: "na" });
        }
      }

      for(const rule of semanticRules){
        const meta = FIELD_LIBRARY[rule.field] || { label: rule.field };
        const sv = sourceData[rule.field];
        const rv = reviewData[rule.field];
        if(sv === undefined || sv === null || sv === "" || rv === undefined || rv === null || rv === ""){
          bumpProgress();
          comparisons.push({ field: rule.field, label: rule.label, sourceValue: sv ?? null, reviewValue: rv ?? null, status: "na" });
          continue;
        }
        const verdict = await checkSemanticMatch(meta.label, sv, rv);
        bumpProgress();
        comparisons.push({
          field: rule.field,
          label: rule.label,
          sourceValue: sv,
          reviewValue: rv,
          status: verdict.match ? "pass" : "fail",
          note: verdict.match ? "" : verdict.note,
        });
      }

      function pushConflictWarnings(conflicts, sideLabel, otherData){
        conflicts.forEach(c => {
          const meta = FIELD_LIBRARY[c.field] || { label: c.field };
          const unit = meta.unit ? " " + meta.unit : "";
          const valuesText = c.entries.map(e => `${e.fileName}: ${e.value}${unit}`).join(" · ");
          const otherVal = otherData[c.field];
          const otherDisplay = (otherVal !== undefined && otherVal !== null && otherVal !== "") ? `${otherVal}${unit}` : null;
          comparisons.push({
            field: c.field,
            label: `${meta.label} — ${sideLabel} disagree`,
            sourceValue: sideLabel === "original documents" ? valuesText : otherDisplay,
            reviewValue: sideLabel === "original documents" ? otherDisplay : valuesText,
            status: "warn",
            note: "These uploaded files show different values for this field — please verify which one is correct.",
          });
        });
      }
      pushConflictWarnings(sourceConflicts, "original documents", reviewData);
      pushConflictWarnings(reviewConflicts, "documents under review", sourceData);

      const overallPass = comparisons.every(c => c.status !== "fail");
      set.result = { extractedSource: sourceData, extractedReview: reviewData, comparisons, overallPass, checkedAt: new Date() };
      set.status = "done";
    } catch(err){
      set.status = "done";
      set.error = (err && err.message) ? err.message : "Something went wrong while checking this set. Please try again.";
      set.result = null;
    }
    renderSets();
  }

  checkBtn.disabled = false;
  checkBtn.innerHTML = "Check all sets";
  progressLabel.textContent = "Done — 100%";
  setTimeout(() => {
    progressTrack.classList.remove("active");
    progressLabel.classList.remove("active");
  }, 900);
  document.getElementById("exportBtn").disabled = !state.sets.some(s => s.result);
}

document.getElementById("checkAllBtn").addEventListener("click", checkAllSets);

/* ---------------------------------------------------------
   Export results to Excel — two flat, tabular sheets so the
   output can be combined across exports and used to compute
   pass/fail statistics (COUNTIF, pivot tables, etc.)
--------------------------------------------------------- */
function formatTimestamp(d){
  if(!d) return "";
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function buildSummaryRows(){
  const rows = [["Set #", "Set name", "Invoice number", "Checked at", "Rules checked", "OK", "Mismatches", "Warnings", "N/A", "Result"]];
  state.sets.forEach((set, pos) => {
    if(!set.result) return;
    const title = set.customName !== null ? set.customName : ((pos + 1) + ". Document set");
    const invoiceNum = (set.result.extractedSource && set.result.extractedSource.invoiceNumber)
      || (set.result.extractedReview && set.result.extractedReview.invoiceNumber)
      || "Not specified";
    const okCount = set.result.comparisons.filter(c => c.status === "pass").length;
    const failCount = set.result.comparisons.filter(c => c.status === "fail").length;
    const warnCount = set.result.comparisons.filter(c => c.status === "warn").length;
    const naCount = set.result.comparisons.filter(c => c.status === "na").length;
    const resultText = failCount > 0 ? "Mismatch" : (warnCount > 0 ? "OK (with notes)" : "OK");
    rows.push([
      pos + 1,
      title,
      invoiceNum,
      formatTimestamp(set.result.checkedAt),
      set.result.comparisons.length,
      okCount,
      failCount,
      warnCount,
      naCount,
      resultText,
    ]);
  });
  return rows;
}

function buildDetailRows(){
  const rows = [["Set #", "Set name", "Field", "Source", "Document under review", "Status", "Note"]];
  state.sets.forEach((set, pos) => {
    if(!set.result) return;
    const title = set.customName !== null ? set.customName : ((pos + 1) + ". Document set");
    set.result.comparisons.forEach(c => {
      const statusText = c.status === "pass" ? "OK" : c.status === "fail" ? "Mismatch" : c.status === "warn" ? "Check" : "N/A";
      rows.push([pos + 1, title, c.label, c.sourceValue ?? "", c.reviewValue ?? "", statusText, c.note || ""]);
    });
  });
  return rows;
}

function exportToExcel(){
  if(typeof XLSX === "undefined"){
    showGlobalError("The Excel export library failed to load. Check your internet connection and try again.");
    return;
  }
  const summaryRows = buildSummaryRows();
  const detailRows = buildDetailRows();
  if(summaryRows.length <= 1){
    showGlobalError("There are no checked document sets to export yet.");
    return;
  }

  const summaryWs = XLSX.utils.aoa_to_sheet(summaryRows);
  summaryWs["!cols"] = [{ wch: 7 }, { wch: 22 }, { wch: 20 }, { wch: 17 }, { wch: 13 }, { wch: 7 }, { wch: 12 }, { wch: 11 }, { wch: 7 }, { wch: 15 }];

  const detailWs = XLSX.utils.aoa_to_sheet(detailRows);
  detailWs["!cols"] = [{ wch: 7 }, { wch: 22 }, { wch: 35 }, { wch: 32 }, { wch: 32 }, { wch: 11 }, { wch: 45 }];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, summaryWs, "Summary");
  XLSX.utils.book_append_sheet(wb, detailWs, "Details");
  const today = new Date().toISOString().slice(0, 10);
  XLSX.writeFile(wb, `cargocheck-results-${today}.xlsx`);
}

document.getElementById("exportBtn").addEventListener("click", exportToExcel);

/* ---------------------------------------------------------
   Init
--------------------------------------------------------- */
state.sets.push(newSet());
renderRules();
renderSets();
</script>
